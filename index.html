<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ספריית וידאו טאי-צ'י בישיבה - 46 סרטוני הדרכה למתרגלים בכל הרמות">
  <title>ספריית טאי-צ'י בישיבה | Chair Tai Chi Library</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --disney-blue: #113CCF;
      --dark-blue: #1A1A2E;
      --light-blue: #0F4C81;
      --bg-gray: #F3F3F3;
      --white: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.15);
      --shadow-lg: 0 8px 24px rgba(17, 60, 207, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Heebo', 'Assistant', 'Rubik', sans-serif;
      background: var(--dark-blue);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header - Disney+ Style */
    header {
      background: linear-gradient(135deg, var(--disney-blue), var(--light-blue));
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.95;
      font-weight: 300;
    }

    /* Controls Bar */
    .controls {
      background: var(--bg-gray);
      padding: 1.5rem 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .search-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    #search-input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      padding-right: 2.5rem;
      border: 2px solid var(--disney-blue);
      border-radius: 24px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    #search-input:focus {
      border-color: var(--light-blue);
      box-shadow: 0 0 0 3px rgba(17, 60, 207, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--disney-blue);
      font-size: 1.2rem;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.6rem 1.5rem;
      background: var(--white);
      border: 2px solid var(--disney-blue);
      color: var(--disney-blue);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--disney-blue);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* Main Content */
    main {
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Carousel Section */
    .carousel {
      margin-bottom: 3rem;
    }

    .carousel h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      padding: 0 1rem;
      color: var(--white);
      font-weight: 600;
    }

    .video-row {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      padding: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--disney-blue) transparent;
    }

    /* Custom Scrollbar */
    .video-row::-webkit-scrollbar {
      height: 10px;
    }

    .video-row::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
    }

    .video-row::-webkit-scrollbar-thumb {
      background: var(--disney-blue);
      border-radius: 5px;
    }

    .video-row::-webkit-scrollbar-thumb:hover {
      background: var(--light-blue);
    }

    /* Video Cards - Netflix/Disney Style */
    .video-card {
      min-width: 300px;
      max-width: 300px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, z-index 0.3s ease;
      border-radius: 12px;
      overflow: hidden;
      background: var(--white);
      flex-shrink: 0;
      position: relative;
    }

    .video-card:hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-lg);
      z-index: 10;
    }

    .thumbnail {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail img {
      transform: scale(1.1);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 4rem;
      color: var(--white);
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .video-card:hover .play-overlay {
      opacity: 1;
    }

    .video-info {
      padding: 1rem;
      background: var(--white);
      color: var(--dark-blue);
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-blue);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      min-height: 2.8em;
    }

    .video-author {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.5rem;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 3rem;
      font-size: 1.3rem;
      color: var(--white);
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 30px;
      height: 30px;
      margin-right: 10px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: var(--disney-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
      animation: fadeIn 0.3s ease;
    }

    .modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--white);
      border-radius: 16px;
      max-width: 95vw;
      max-height: 95vh;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0,0,0,0.7);
      color: var(--white);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      background: var(--disney-blue);
      transform: rotate(90deg);
    }

    #player-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 ratio */
      background: #000;
    }

    #player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #modal-title {
      padding: 1.5rem;
      font-size: 1.5rem;
      color: var(--dark-blue);
      text-align: center;
      background: var(--white);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(255,255,255,0.7);
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      header p {
        font-size: 0.95rem;
      }

      .controls {
        padding: 1rem;
      }

      .video-card {
        min-width: 220px;
        max-width: 220px;
      }

      .carousel h2 {
        font-size: 1.4rem;
      }

      main {
        padding: 1rem;
      }

      .modal {
        padding: 1rem;
      }

      #modal-title {
        font-size: 1.2rem;
        padding: 1rem;
      }
    }

    /* RTL Support */
    [dir="rtl"] .video-row {
      direction: ltr; /* Keep horizontal scroll natural */
    }

    [dir="rtl"] .search-icon {
      left: auto;
      right: 1rem;
    }

    [dir="rtl"] #search-input {
      padding-right: 1.2rem;
      padding-left: 2.5rem;
    }

    /* Stats Bar */
    .stats {
      background: rgba(255,255,255,0.05);
      padding: 1rem 2rem;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>🪷 ספריית טאי-צ'י בישיבה</h1>
    <p>Chair Tai Chi Video Library • 46 Guided Videos</p>
  </header>

  <!-- Stats Bar -->
  <div class="stats">
    <span id="video-count">טוען סרטונים...</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="search-input"
        placeholder="חפש סרטון לפי כותרת או מדריך..."
        autocomplete="off"
      >
    </div>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">הכל</button>
      <button class="filter-btn" data-filter="breathing">נשימה</button>
      <button class="filter-btn" data-filter="balance">איזון</button>
      <button class="filter-btn" data-filter="stretch">גמישות</button>
      <button class="filter-btn" data-filter="energy">אנרגיה</button>
    </div>
  </div>

  <!-- Main Content -->
  <main>
    <!-- All Videos Carousel -->
    <section class="carousel">
      <h2>כל הסרטונים</h2>
      <div class="video-row" id="all-videos">
        <div class="loading">טוען סרטונים</div>
      </div>
    </section>
  </main>

  <!-- Modal for Video Player -->
  <div id="video-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal" aria-label="סגור">✕</button>
      <div id="player-container"></div>
      <h3 id="modal-title"></h3>
    </div>
  </div>

  <script>
    // Video URLs from chair-tai-chi-videos.md
    // ✅ Only validated, working videos (46 total)
    const videoUrls = [
      "https://youtu.be/SYfZtszPao4?si=-cQ7V90u6_S_gZEv",
      "https://youtu.be/soKKAXX-Vto?si=BbgGY3o25lrZ1LYB",
      "https://youtu.be/o8-zUNbKTME",
      "https://youtu.be/Aaq_7KcXFHA?si=jwesl9hV8nX_1734",
      "https://youtu.be/tljjjyRuUG8?si=jgsQurLKsKL20tnV",
      "https://youtu.be/q43VN1YkrGE?si=q1qm0qX6EFX1UVEE",
      "https://youtu.be/RfdCSN-NK7U?si=NRN87wwlA1DsyzHI",
      "https://youtu.be/6rLG3Ys-wIU?si=6IRAOgTpjZxfNFSl",
      "https://www.youtube.com/watch?v=p1S78x0fOJo",
      "https://www.youtube.com/watch?v=r8uwcI0OsNA",
      "https://www.youtube.com/watch?v=fFL8bIqTO3o",
      "https://www.youtube.com/watch?v=6L43P1MY2KA",
      "https://www.youtube.com/watch?v=b1H3xO3x_Js",
      "https://www.youtube.com/watch?v=RqcOCBb4arc",
      "https://www.youtube.com/watch?v=SpxY8TcizQY",
      "https://www.youtube.com/watch?v=pwwISeTzCc4",
      "http://www.youtube.com/watch?v=cHqv5QxuRmA",
      "https://www.youtube.com/watch?v=pok5-iPMDjQ",
      "https://www.youtube.com/watch?v=SM7as0fIAUE",
      "https://www.youtube.com/watch?v=znH7QY18T-c",
      "https://www.youtube.com/watch?v=dq9lF7Wr2wo",
      "https://www.youtube.com/watch?v=5i0PQw8lICo",
      "https://youtu.be/DS5kLlqqmIY?si=nf7CT2xREUdsFYcP",
      "https://www.youtube.com/watch?v=NcITKzMHFSs",
      "https://www.youtube.com/watch?v=0ErC3LANL1Q",
      "https://www.youtube.com/watch?v=_V29hE0_oBE",
      "https://www.youtube.com/watch?v=G2amZq5HvqA",
      "https://www.youtube.com/watch?v=XHpljSUzwog",
      "https://www.youtube.com/watch?v=p8ReVp6Yn4U",
      "https://www.youtube.com/watch?v=33ClGUpYE30",
      "https://www.youtube.com/watch?v=n379_HZjYjI",
      "https://www.youtube.com/watch?v=XY4ul0F7bfE",
      "https://www.youtube.com/watch?v=BnBfiUHmM8g",
      "https://www.youtube.com/watch?v=4fdpEH21DWk",
      "https://www.youtube.com/watch?v=B2n6tqtJsVg",
      "https://www.youtube.com/watch?v=pYh6LZGD88s",
      "https://www.youtube.com/watch?v=oeffEIYJQyo",
      "https://www.youtube.com/watch?v=JhFkW809DUE",
      "https://www.youtube.com/watch?v=cz81GvnJLoA",
      "https://www.youtube.com/watch?v=uZvnwgz4_4Q",
      "https://www.youtube.com/watch?v=o_8my1fZK4I",
      "https://www.youtube.com/watch?v=hdDXWv-OxZ4",
      "https://www.youtube.com/watch?v=8E24WmkFO50",
      "https://www.youtube.com/watch?v=R2ZNC9wSP1E",
      "https://www.youtube.com/watch?v=aUs4NK2s170",
      "https://www.youtube.com/watch?v=mDWixqKLeFA"
    ];

    // Global state
    let allVideos = [];
    let currentFilter = 'all';

    // Extract YouTube video ID from URL
    function extractVideoId(url) {
      const patterns = [
        /youtu\.be\/([a-zA-Z0-9_-]+)/,
        /youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)/
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    // Categorize video by title keywords
    function categorizeVideo(title) {
      const categories = [];
      const lower = title.toLowerCase();

      if (/breath|breathing|נשימה|pranayama/i.test(lower)) categories.push('breathing');
      if (/balance|stability|איזון|יציבות/i.test(lower)) categories.push('balance');
      if (/stretch|flexibility|גמישות|מתיחה/i.test(lower)) categories.push('stretch');
      if (/energy|vitality|אנרגיה|חיוניות/i.test(lower)) categories.push('energy');

      return categories.length > 0 ? categories : ['general'];
    }

    // Fetch video metadata from YouTube oEmbed API
    async function fetchVideoData(videoId) {
      try {
        const response = await fetch(
          `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`
        );

        if (!response.ok) throw new Error('API Error');

        const data = await response.json();
        const categories = categorizeVideo(data.title);

        return {
          id: videoId,
          title: data.title,
          thumbnail: data.thumbnail_url.replace('hqdefault', 'mqdefault'), // Better quality
          author: data.author_name,
          categories: categories
        };
      } catch (error) {
        console.warn(`Failed to fetch data for ${videoId}:`, error);
        // Fallback to YouTube's default thumbnail
        return {
          id: videoId,
          title: 'Chair Tai Chi Video',
          thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
          author: 'Unknown',
          categories: ['general']
        };
      }
    }

    // Create video card element
    function createVideoCard(videoData) {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.dataset.videoId = videoData.id;
      card.dataset.categories = videoData.categories.join(',');

      card.innerHTML = `
        <div class="thumbnail">
          <img src="${videoData.thumbnail}" alt="${videoData.title}" loading="lazy">
          <div class="play-overlay">▶</div>
        </div>
        <div class="video-info">
          <h4 class="video-title">${videoData.title}</h4>
          <p class="video-author">${videoData.author}</p>
        </div>
      `;

      card.addEventListener('click', () => openModal(videoData));
      return card;
    }

    // Open video modal - Display preview and open in YouTube
    function openModal(videoData) {
      const modal = document.getElementById('video-modal');
      const playerContainer = document.getElementById('player-container');
      const modalTitle = document.getElementById('modal-title');

      // Display beautiful preview with "Watch on YouTube" button
      playerContainer.innerHTML = `
        <div style="position: relative; width: 100%; padding-bottom: 56.25%; background: #000;">
          <img
            src="${videoData.thumbnail}"
            alt="${videoData.title}"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7;"
          >
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);">
            <a
              href="https://www.youtube.com/watch?v=${videoData.id}"
              target="_blank"
              rel="noopener noreferrer"
              style="display: flex; align-items: center; gap: 0.75rem; padding: 1.25rem 3rem; background: #FF0000; color: white; text-decoration: none; border-radius: 50px; font-size: 1.5rem; font-weight: 700; transition: all 0.3s; box-shadow: 0 8px 32px rgba(255,0,0,0.4); border: 3px solid white;"
              onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 12px 48px rgba(255,0,0,0.6)'"
              onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 8px 32px rgba(255,0,0,0.4)'"
            >
              <svg width="32" height="32" viewBox="0 0 24 24" fill="white">
                <path d="M8 5v14l11-7z"/>
              </svg>
              צפה ב-YouTube
            </a>
            <p style="margin-top: 1.5rem; color: white; font-size: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
              הסרטון ייפתח בחלון חדש
            </p>
          </div>
        </div>
        <div style="text-align: center; padding: 1.5rem; background: white;">
          <p style="color: #666; font-size: 0.95rem; line-height: 1.6;">
            <strong>מדריך:</strong> ${videoData.author}
          </p>
        </div>
      `;

      modalTitle.textContent = videoData.title;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // Close video modal
    function closeModal() {
      const modal = document.getElementById('video-modal');
      const playerContainer = document.getElementById('player-container');

      playerContainer.innerHTML = ''; // Stop video
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    // Search videos
    function searchVideos(query) {
      const cards = document.querySelectorAll('.video-card');
      const lowerQuery = query.toLowerCase().trim();

      let visibleCount = 0;

      cards.forEach(card => {
        const title = card.querySelector('.video-title').textContent.toLowerCase();
        const author = card.querySelector('.video-author').textContent.toLowerCase();
        const matchesSearch = !lowerQuery || title.includes(lowerQuery) || author.includes(lowerQuery);
        const matchesFilter = currentFilter === 'all' || card.dataset.categories.includes(currentFilter);

        if (matchesSearch && matchesFilter) {
          card.style.display = 'block';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      updateStats(visibleCount);
    }

    // Filter videos by category
    function filterVideos(category) {
      currentFilter = category;

      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === category);
      });

      // Apply filter
      const searchQuery = document.getElementById('search-input').value;
      searchVideos(searchQuery);
    }

    // Update stats display
    function updateStats(count) {
      const statsEl = document.getElementById('video-count');
      const total = allVideos.length;

      if (count === total) {
        statsEl.textContent = `${total} סרטונים זמינים`;
      } else {
        statsEl.textContent = `מציג ${count} מתוך ${total} סרטונים`;
      }
    }

    // Initialize app
    async function init() {
      console.log('🚀 Loading Chair Tai Chi Video Library...');

      const container = document.getElementById('all-videos');

      try {
        // Extract video IDs
        const videoIds = videoUrls
          .map(extractVideoId)
          .filter(Boolean);

        console.log(`📊 Found ${videoIds.length} videos`);

        // Fetch all video data (with rate limiting)
        const batchSize = 10;
        for (let i = 0; i < videoIds.length; i += batchSize) {
          const batch = videoIds.slice(i, i + batchSize);
          const batchData = await Promise.all(batch.map(fetchVideoData));
          allVideos.push(...batchData);

          // Update UI progressively
          if (i === 0) {
            container.innerHTML = ''; // Clear loading message
          }

          batchData.forEach(video => {
            const card = createVideoCard(video);
            container.appendChild(card);
          });

          console.log(`✅ Loaded ${Math.min(i + batchSize, videoIds.length)}/${videoIds.length} videos`);

          // Small delay to avoid overwhelming the API
          if (i + batchSize < videoIds.length) {
            await new Promise(resolve => setTimeout(resolve, 100));
          }
        }

        updateStats(allVideos.length);
        console.log('✨ All videos loaded successfully!');

      } catch (error) {
        console.error('❌ Error loading videos:', error);
        container.innerHTML = `
          <div class="empty-state">
            <h3>שגיאה בטעינת הסרטונים</h3>
            <p>אנא רענן את הדף ונסה שוב</p>
          </div>
        `;
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      init();

      // Search input
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchVideos(e.target.value);
      });

      // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          filterVideos(btn.dataset.filter);
        });
      });

      // Modal close button
      document.getElementById('close-modal').addEventListener('click', closeModal);

      // Close modal on outside click
      document.getElementById('video-modal').addEventListener('click', (e) => {
        if (e.target.id === 'video-modal') {
          closeModal();
        }
      });

      // Close modal on ESC key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
